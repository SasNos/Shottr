<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shottr</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <div class="group" role="group" aria-label="Tools">
        <button type="button" id="tool-pen" aria-pressed="true">Pen</button>
        <button type="button" id="tool-rect" aria-pressed="false">Rectangle</button>
        <button type="button" id="tool-ellipse" aria-pressed="false">Ellipse</button>
        <button type="button" id="tool-comment" aria-pressed="false">Comment</button>
      </div>
      <label class="group field">
        Color
        <input type="color" id="color-picker" value="#e5322d" />
      </label>
      <label class="group field">
        Stroke
        <input type="range" id="stroke-width" min="1" max="5" step="1" value="3" />
        <span id="stroke-width-value" class="value">3 px</span>
      </label>
      <div class="group" role="group" aria-label="Comment text">
        <button type="button" id="format-bold" class="bold" aria-label="Bold" aria-pressed="false">B</button>
        <button type="button" id="format-italic" class="italic" aria-label="Italic" aria-pressed="false">I</button>
        <select id="font-size" aria-label="Font size">
          <option value="10">10 px</option>
          <option value="12">12 px</option>
          <option value="14">14 px</option>
          <option value="16" selected>16 px</option>
          <option value="20">20 px</option>
          <option value="24">24 px</option>
          <option value="32">32 px</option>
          <option value="48">48 px</option>
        </select>
      </div>
      <div class="group" role="group" aria-label="History">
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
        <button type="button" id="clear">Clear</button>
      </div>
      <div class="spacer"></div>
      <label class="group field">
        Format
        <select id="format">
          <option value="png">PNG</option>
          <option value="webp">WebP</option>
          <option value="pdf">PDF</option>
        </select>
      </label>
      <div class="group" role="group" aria-label="Output">
        <button type="button" id="save" class="primary">Download</button>
        <button type="button" id="copy">Copy</button>
        <button type="button" id="share" hidden>Share</button>
        <button type="button" id="cancel">Cancel</button>
      </div>
    </header>
    <main class="stage">
      <div id="wrap" class="wrap"></div>
    </main>
    <p id="status" role="status"></p>
    <script type="module" src="editor-main.js"></script>
  </body>
</html>
